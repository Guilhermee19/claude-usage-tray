name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # publicar o release quando a tag v* é criada

jobs:
  linux:
    name: Linux (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv python3-tk python3-gi gir1.2-ayatanaappindicator3-0.1 x11-utils xvfb
      - name: Ambiente virtual
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -q -r requirements.txt
      - name: Importa o app e desenha os ícones
        run: |
          xvfb-run -a .venv/bin/python -c "
          import claude_usage_tray.app
          from claude_usage_tray import tray_icon
          for style in tray_icon.STYLES:
              for mono in (False, True):
                  tray_icon.render(49, style, mono)
          print('ok')
          "
      - name: Sintaxe dos scripts
        run: bash -n install-linux.sh && bash -n start-linux.sh

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Gera o executável
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsage-windows
          path: dist/ClaudeUsage.exe

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ClaudeUsage-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: ClaudeUsage.exe
          generate_release_notes: true
